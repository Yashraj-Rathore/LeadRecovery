name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOCKER_API_VERSION: "1.43"
  NUGET_XMLDOC_MODE: skip
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore locked dependencies
        run: dotnet restore LeadRecovery.sln --locked-mode

      - name: Verify formatting
        run: dotnet format LeadRecovery.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build LeadRecovery.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test LeadRecovery.sln --configuration Release --no-build

      - name: Review vulnerable dependencies
        run: dotnet list LeadRecovery.sln package --vulnerable --include-transitive
