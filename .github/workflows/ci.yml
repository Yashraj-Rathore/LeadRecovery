name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOCKER_API_VERSION: "1.43"
  NUGET_XMLDOC_MODE: skip
  NEXT_TELEMETRY_DISABLED: 1
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  REDOCLY_TELEMETRY: off
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore locked dependencies
        run: dotnet restore LeadRecovery.sln --locked-mode

      - name: Verify formatting
        run: dotnet format LeadRecovery.sln --no-restore --verify-no-changes

      - name: Build with static analyzers
        run: dotnet build LeadRecovery.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test LeadRecovery.sln --configuration Release --no-build

      - name: Review vulnerable dependencies
        run: dotnet list LeadRecovery.sln package --vulnerable --include-transitive

  frontend-e2e:
    name: Frontend and browser acceptance
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
        env:
          POSTGRES_DB: leadrecovery_e2e
          POSTGRES_USER: leadrecovery_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadrecovery_e2e -d leadrecovery_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      API_BASE_URL: http://127.0.0.1:8080
      CONNECTIONSTRINGS__DATABASE: Host=127.0.0.1;Port=5432;Database=leadrecovery_e2e;Username=leadrecovery_e2e
      E2E_OWNER_EMAIL: owner@alpha.example.test
      E2E_STAFF_EMAIL: staff@alpha.example.test
      E2E_BETA_OWNER_EMAIL: owner@beta.example.test

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm --version

      - name: Restore backend and frontend dependencies
        run: |
          dotnet tool restore
          dotnet restore LeadRecovery.sln --locked-mode
          pnpm install --frozen-lockfile

      - name: Build API
        run: dotnet build LeadRecovery.sln --configuration Release --no-restore --warnaserror

      - name: Generate ephemeral demo values
        run: |
          echo "E2E_OWNER_PASSWORD=Aa1!$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "E2E_STAFF_PASSWORD=Bb2!$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "E2E_BETA_OWNER_PASSWORD=Cc3!$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          suffix=$(printf '%04d' $((100 + GITHUB_RUN_NUMBER % 90)))
          echo "E2E_ALPHA_URGENT_PHONE=+1416555${suffix}" >> "$GITHUB_ENV"
          echo "E2E_ALPHA_BOOKING_PHONE=+1416555$((10#$suffix + 1))" >> "$GITHUB_ENV"
          echo "E2E_BETA_LEAD_PHONE=+1416555$((10#$suffix + 2))" >> "$GITHUB_ENV"
          echo "E2E_ALPHA_PROVIDER_PHONE=+1416555$((10#$suffix + 3))" >> "$GITHUB_ENV"
          echo "E2E_BETA_PROVIDER_PHONE=+1416555$((10#$suffix + 4))" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/LeadRecovery.Infrastructure/LeadRecovery.Infrastructure.csproj
          --startup-project src/LeadRecovery.Api/LeadRecovery.Api.csproj
          --configuration Release
          --no-build

      - name: Type-check and build frontend
        run: |
          pnpm frontend:typecheck
          pnpm frontend:build

      - name: Review vulnerable frontend dependencies
        run: pnpm audit --audit-level high

      - name: Install Chromium
        run: pnpm --dir tests/LeadRecovery.E2E exec playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: pnpm e2e

  repository-policy:
    name: API and repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Restore frontend tooling
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI
        run: pnpm openapi:lint

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.2

      - name: Validate deployment and CI/CD artifacts
        shell: pwsh
        run: |
          ./eng/Test-DeploymentArtifacts.ps1
          ./eng/Test-CiCdArtifacts.ps1

      - name: Lint GitHub Actions workflows
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --show-error --silent \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Scan repository for committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

  container-images:
    name: Container image scan (${{ matrix.component }})
    needs:
      - backend
      - frontend-e2e
      - repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: deploy/docker/api.Dockerfile
            image: leadrecovery-api
          - component: worker
            dockerfile: deploy/docker/worker.Dockerfile
            image: leadrecovery-worker
          - component: web
            dockerfile: deploy/docker/web.Dockerfile
            image: leadrecovery-web

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build without pushing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
            CREATED=1970-01-01T00:00:00Z
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}

      - name: Reject High or Critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ matrix.image }}:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
