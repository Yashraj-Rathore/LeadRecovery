name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected environment to restore
        required: true
        type: choice
        options:
          - staging
          - production
      release_revision:
        description: Full 40-character Git commit SHA for the prior release
        required: true
        type: string
      api_digest:
        description: Prior API digest, including sha256 prefix
        required: true
        type: string
      worker_digest:
        description: Prior Worker digest, including sha256 prefix
        required: true
        type: string
      web_digest:
        description: Prior Web digest, including sha256 prefix
        required: true
        type: string
      confirm_database_compatibility:
        description: Confirm the current schema is compatible with the prior application
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rollback-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Approve and restore ${{ inputs.target_environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.target_environment }}
      url: ${{ vars.PUBLIC_BASE_URL }}

    steps:
      - name: Check out current trusted deployment tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Validate rollback coordinates
        shell: pwsh
        env:
          CONFIRMED: ${{ inputs.confirm_database_compatibility }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          API_DIGEST: ${{ inputs.api_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
          WEB_DIGEST: ${{ inputs.web_digest }}
        run: |
          if ($env:CONFIRMED -ne 'true') {
            throw 'Database compatibility must be confirmed before rollback.'
          }
          if ($env:RELEASE_REVISION -notmatch '^[a-f0-9]{40}$') {
            throw 'release_revision must be a full lowercase Git SHA.'
          }
          & git merge-base --is-ancestor $env:RELEASE_REVISION origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'release_revision must identify a commit reachable from main.'
          }
          foreach ($digest in @($env:API_DIGEST, $env:WORKER_DIGEST, $env:WEB_DIGEST)) {
            if ($digest -notmatch '^sha256:[a-f0-9]{64}$') {
              throw 'Every rollback image must use an immutable sha256 digest.'
            }
          }

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.2

      - name: Configure protected cluster access
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Derive immutable rollback images
        shell: pwsh
        env:
          API_DIGEST: ${{ inputs.api_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
          WEB_DIGEST: ${{ inputs.web_digest }}
        run: |
          $prefix = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())"
          "API_IMAGE=$prefix-api@$($env:API_DIGEST)" >> $env:GITHUB_ENV
          "WORKER_IMAGE=$prefix-worker@$($env:WORKER_DIGEST)" >> $env:GITHUB_ENV
          "WEB_IMAGE=$prefix-web@$($env:WEB_DIGEST)" >> $env:GITHUB_ENV

      - name: Restore prior application without reversing migrations
        shell: pwsh
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          $parameters = @{
            Environment = $env:TARGET_ENVIRONMENT
            ApiImage = $env:API_IMAGE
            WorkerImage = $env:WORKER_IMAGE
            WebImage = $env:WEB_IMAGE
            PublicBaseUrl = $env:PUBLIC_BASE_URL
            ReleaseRevision = $env:RELEASE_REVISION
            Operation = 'Rollback'
            OutputDirectory = Join-Path $env:RUNNER_TEMP 'rollback-record'
          }
          ./eng/Deploy-KubernetesRelease.ps1 @parameters

      - name: Upload rollback record
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rollback-${{ inputs.target_environment }}-${{ inputs.release_revision }}
          path: ${{ runner.temp }}/rollback-record
          if-no-files-found: warn
          retention-days: 90
