openapi: 3.1.0
info:
  title: LeadRecovery API
  version: 1.0.0-milestone.4
  description: Implemented Milestone 4 browser, lead-read, Twilio webhook, and SMS workflow contract.
servers:
  - url: https://app.example.com/api/v1
paths:
  /webhooks/twilio/call-status:
    post:
      tags: [Twilio webhooks]
      summary: Accept an authenticated Twilio call-status callback
      description: Persists recovery intent only; this endpoint does not send SMS.
      security: []
      parameters:
        - in: header
          name: X-Twilio-Signature
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [CallSid, CallStatus, From, To]
              properties:
                CallSid:
                  type: string
                  pattern: '^CA[0-9A-Fa-f]{32}$'
                CallStatus:
                  type: string
                  maxLength: 50
                From:
                  type: string
                To:
                  type: string
      responses:
        '204':
          description: Callback durably processed or safely acknowledged.
        '400':
          description: Signed callback form is malformed.
        '403':
          description: Signature is missing or invalid.
        '503':
          description: Auth token or canonical webhook URL is not configured.
  /webhooks/twilio/sms/inbound:
    post:
      tags: [Twilio webhooks]
      summary: Accept a signed inbound SMS callback
      security: []
      parameters:
        - in: header
          name: X-Twilio-Signature
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [MessageSid, From, To, Body]
              properties:
                MessageSid:
                  type: string
                  pattern: '^(SM|MM)[0-9A-Fa-f]{32}$'
                From:
                  type: string
                To:
                  type: string
                Body:
                  type: string
                  minLength: 1
                  maxLength: 1600
      responses:
        '204':
          description: Message persisted once or safely acknowledged; opt-out is applied atomically.
        '400':
          description: Signed callback form is malformed.
        '403':
          description: Signature is missing or invalid.
        '503':
          description: Auth token or canonical webhook URL is not configured.
  /webhooks/twilio/sms/status:
    post:
      tags: [Twilio webhooks]
      summary: Accept a signed outbound SMS delivery callback
      security: []
      parameters:
        - in: header
          name: X-Twilio-Signature
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [MessageSid, MessageStatus]
              properties:
                MessageSid:
                  type: string
                  pattern: '^(SM|MM)[0-9A-Fa-f]{32}$'
                MessageStatus:
                  type: string
                  maxLength: 50
                ErrorCode:
                  type: string
                  maxLength: 50
      responses:
        '204':
          description: Delivery progression updated idempotently or safely acknowledged.
        '400':
          description: Signed callback form is malformed.
        '403':
          description: Signature is missing or invalid.
        '503':
          description: Auth token or canonical webhook URL is not configured.
  /auth/csrf:
    get:
      tags: [Authentication]
      summary: Issue an antiforgery request token
      security: []
      responses:
        '200':
          description: Request token; the paired HttpOnly cookie is set on the response.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Create a same-origin browser session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user, tenant, and role; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Antiforgery validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Generic credential, user, membership, or tenant failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Login rate limit exceeded.
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the currently validated user, tenant, and role
      security:
        - cookieSession: []
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Missing, expired, revoked, or otherwise invalid session.
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate the user's issued sessions and clear the browser cookie
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidated.
        '400':
          description: Antiforgery validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Not authenticated.
  /leads:
    get:
      tags: [Leads]
      summary: List leads owned by the authenticated tenant
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: [string, 'null']
          description: Opaque pagination cursor from the previous response.
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Tenant-scoped lead page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadPage'
        '400':
          description: Invalid page size or cursor.
        '401':
          description: Not authenticated.
        '403':
          description: Authenticated session lacks a tenant member role.
  /leads/{leadId}:
    get:
      tags: [Leads]
      summary: Get a lead summary owned by the authenticated tenant
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Tenant-scoped lead summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSummary'
        '401':
          description: Not authenticated.
        '403':
          description: Authenticated session lacks a tenant member role.
        '404':
          description: Lead does not exist in the active tenant.
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-LeadRecovery.Session
      description: Production cookie name; Development defaults to `leadrecovery.session`.
  parameters:
    CsrfHeader:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        type: string
        minLength: 1
      description: Request token paired with the antiforgery cookie from `/auth/csrf`.
    LeadId:
      in: path
      name: leadId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CsrfToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    AuthSession:
      type: object
      required: [userId, displayName, email, tenantId, tenantName, role]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        role:
          type: string
          enum: [Owner, Manager, Staff, ReadOnly]
    LeadSummary:
      type: object
      required:
        - id
        - displayName
        - primaryPhoneE164
        - source
        - status
        - urgency
        - automationState
        - createdAtUtc
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, 'null']
        primaryPhoneE164:
          type: string
        source:
          type: string
        status:
          type: string
        urgency:
          type: string
        automationState:
          type: string
        createdAtUtc:
          type: string
          format: date-time
    LeadPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeadSummary'
        nextCursor:
          type: [string, 'null']
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
