openapi: 3.1.0
info:
  title: LeadRecovery API
  version: 1.0.0-milestone.8
  description: Implemented browser, automation control, deterministic workflow, AI review, Twilio webhook, and SMS contract through LR-0802.
servers:
  - url: https://app.example.com/api/v1
paths:
  /webhooks/twilio/call-status:
    post:
      tags: [Twilio webhooks]
      summary: Accept an authenticated Twilio call-status callback
      description: Persists recovery intent only; this endpoint does not send SMS.
      security: []
      parameters:
        - in: header
          name: X-Twilio-Signature
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [CallSid, CallStatus, From, To]
              properties:
                CallSid:
                  type: string
                  pattern: '^CA[0-9A-Fa-f]{32}$'
                CallStatus:
                  type: string
                  maxLength: 50
                From:
                  type: string
                To:
                  type: string
      responses:
        '204':
          description: Callback durably processed or safely acknowledged.
        '400':
          description: Signed callback form is malformed.
        '403':
          description: Signature is missing or invalid.
        '503':
          description: Auth token or canonical webhook URL is not configured.
  /webhooks/twilio/sms/inbound:
    post:
      tags: [Twilio webhooks]
      summary: Accept a signed inbound SMS callback
      security: []
      parameters:
        - in: header
          name: X-Twilio-Signature
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [MessageSid, From, To, Body]
              properties:
                MessageSid:
                  type: string
                  pattern: '^(SM|MM)[0-9A-Fa-f]{32}$'
                From:
                  type: string
                To:
                  type: string
                Body:
                  type: string
                  minLength: 1
                  maxLength: 1600
      responses:
        '204':
          description: Message persisted once or safely acknowledged; opt-out is applied atomically.
        '400':
          description: Signed callback form is malformed.
        '403':
          description: Signature is missing or invalid.
        '503':
          description: Auth token or canonical webhook URL is not configured.
  /webhooks/twilio/sms/status:
    post:
      tags: [Twilio webhooks]
      summary: Accept a signed outbound SMS delivery callback
      security: []
      parameters:
        - in: header
          name: X-Twilio-Signature
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [MessageSid, MessageStatus]
              properties:
                MessageSid:
                  type: string
                  pattern: '^(SM|MM)[0-9A-Fa-f]{32}$'
                MessageStatus:
                  type: string
                  maxLength: 50
                ErrorCode:
                  type: string
                  maxLength: 50
      responses:
        '204':
          description: Delivery progression updated idempotently or safely acknowledged.
        '400':
          description: Signed callback form is malformed.
        '403':
          description: Signature is missing or invalid.
        '503':
          description: Auth token or canonical webhook URL is not configured.
  /auth/csrf:
    get:
      tags: [Authentication]
      summary: Issue an antiforgery request token
      security: []
      responses:
        '200':
          description: Request token; the paired HttpOnly cookie is set on the response.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Create a same-origin browser session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user, tenant, and role; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Antiforgery validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Generic credential, user, membership, or tenant failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Login rate limit exceeded.
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the currently validated user, tenant, and role
      security:
        - cookieSession: []
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Missing, expired, revoked, or otherwise invalid session.
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate the user's issued sessions and clear the browser cookie
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidated.
        '400':
          description: Antiforgery validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Not authenticated.
  /automation/:
    get:
      tags: [Automation]
      summary: Get effective platform and tenant automation state
      security:
        - cookieSession: []
      responses:
        '200':
          description: Current global, tenant, and effective state with tenant concurrency token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationStatus'
        '401':
          description: Not authenticated.
  /automation/tenant:
    post:
      tags: [Automation]
      summary: Pause or resume tenant automation
      description: Owner/Manager only. Pending automated actions are cancelled on disable; manual staff SMS and inbound capture remain available.
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTenantAutomationRequest'
      responses:
        '200':
          description: State applied or already current; cancellation count is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationStatus'
        '400':
          description: Antiforgery, version, or reason validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Not authenticated.
        '403':
          description: Membership is not Owner or Manager.
        '409':
          description: Tenant automation state changed concurrently; current state is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationStatus'
  /leads:
    get:
      tags: [Leads]
      summary: List and filter leads owned by the authenticated tenant
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: [string, 'null']
          description: Opaque pagination cursor from the previous response.
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: status
          schema:
            oneOf:
              - $ref: '#/components/schemas/LeadStatus'
              - type: 'null'
        - in: query
          name: urgency
          schema:
            oneOf:
              - $ref: '#/components/schemas/LeadUrgency'
              - type: 'null'
        - in: query
          name: assignment
          schema:
            type: string
            enum: [all, unassigned, mine]
            default: all
        - in: query
          name: assignedUserId
          schema:
            type: [string, 'null']
            format: uuid
      responses:
        '200':
          description: Filtered tenant-scoped lead page, with urgent human-review work first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadPage'
        '400':
          description: Invalid page size, cursor, or filter.
        '401':
          description: Not authenticated.
        '403':
          description: Authenticated session lacks a tenant member role.
  /leads/assignees:
    get:
      tags: [Leads]
      summary: List active assignable members of the authenticated tenant
      security:
        - cookieSession: []
      responses:
        '200':
          description: Active same-tenant members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignableUser'
        '401':
          description: Not authenticated.
  /leads/{leadId}:
    get:
      tags: [Leads]
      summary: Get tenant-scoped lead detail, timeline, and pending actions
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Current tenant-scoped lead representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDetail'
        '401':
          description: Not authenticated.
        '403':
          description: Authenticated session lacks a tenant member role.
        '404':
          description: Lead does not exist in the active tenant.
  /leads/{leadId}/assignment:
    post:
      tags: [Lead operations]
      summary: Assign or unassign a lead
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignLeadRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery or request validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead is not in the active tenant.
        '409':
          $ref: '#/components/responses/LeadConflict'
  /leads/{leadId}/transitions:
    post:
      tags: [Lead operations]
      summary: Apply an allowed domain lead-status transition
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionLeadRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery, transition, or close-reason validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead is not in the active tenant.
        '409':
          $ref: '#/components/responses/LeadConflict'
  /leads/{leadId}/automation/pause:
    post:
      tags: [Lead operations]
      summary: Pause lead automation and cancel pending automated actions
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadAutomationRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery or state validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead is not in the active tenant.
        '409':
          $ref: '#/components/responses/LeadConflict'
  /leads/{leadId}/automation/resume:
    post:
      tags: [Lead operations]
      summary: Resume eligible lead automation
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadAutomationRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery or state validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead is not in the active tenant.
        '409':
          $ref: '#/components/responses/LeadConflict'
  /leads/{leadId}/notes:
    post:
      tags: [Lead operations]
      summary: Add a plain-text internal lead note
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLeadNoteRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery or note validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead is not in the active tenant.
  /leads/{leadId}/messages:
    get:
      tags: [Lead operations]
      summary: List SMS timeline entries for a lead
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Ordered SMS timeline entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadTimelineItem'
        '401':
          description: Not authenticated.
        '404':
          description: Lead is not in the active tenant.
    post:
      tags: [Lead operations]
      summary: Queue an idempotent manual SMS
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualMessageRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery or message validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead is not in the active tenant.
        '409':
          description: Opt-out, closed Lead, tenant policy, or idempotency conflict.
        '429':
          description: Manual-message rate limit exceeded.
  /leads/{leadId}/booking-link:
    post:
      tags: [Lead operations]
      summary: Queue the active tenant workflow's approved booking link
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadBookingRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery, state, or request validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead is not in the active tenant.
        '409':
          $ref: '#/components/responses/LeadConflict'
  /leads/{leadId}/scheduled-actions/{actionId}/cancel:
    post:
      tags: [Lead operations]
      summary: Cancel a pending action owned by the active tenant and lead
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery validation failed or the action is not Pending.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead or action is not in the active tenant.
  /leads/{leadId}/ai-analyses/{analysisId}/accept:
    post:
      tags: [Lead operations]
      summary: Accept an immutable AI suggestion as staff-reviewed guidance
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/AnalysisId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAiAnalysisRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery, review-state, or request validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead or analysis is not in the active tenant.
        '409':
          $ref: '#/components/responses/LeadConflict'
  /leads/{leadId}/ai-analyses/{analysisId}/edit:
    post:
      tags: [Lead operations]
      summary: Store staff-corrected values without overwriting the AI output
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/AnalysisId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAiAnalysisRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery, category, urgency, field, or review-state validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead or analysis is not in the active tenant.
        '409':
          $ref: '#/components/responses/LeadConflict'
  /leads/{leadId}/ai-analyses/{analysisId}/reject:
    post:
      tags: [Lead operations]
      summary: Reject an AI suggestion with an optional evaluation reason
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/AnalysisId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAiAnalysisRequest'
      responses:
        '200':
          $ref: '#/components/responses/LeadOperationSucceeded'
        '400':
          description: Antiforgery, review-state, or request validation failed.
        '401':
          description: Not authenticated.
        '403':
          description: ReadOnly or otherwise unauthorized membership.
        '404':
          description: Lead or analysis is not in the active tenant.
        '409':
          $ref: '#/components/responses/LeadConflict'
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-LeadRecovery.Session
      description: Production cookie name; Development defaults to `leadrecovery.session`.
  parameters:
    CsrfHeader:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        type: string
        minLength: 1
      description: Request token paired with the antiforgery cookie from `/auth/csrf`.
    LeadId:
      in: path
      name: leadId
      required: true
      schema:
        type: string
        format: uuid
    ActionId:
      in: path
      name: actionId
      required: true
      schema:
        type: string
        format: uuid
    AnalysisId:
      in: path
      name: analysisId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    LeadOperationSucceeded:
      description: Operation applied and the current lead representation returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LeadDetail'
    LeadConflict:
      description: The lead changed concurrently or tenant policy blocks the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/LeadConflictProblem'
  schemas:
    CsrfToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    AuthSession:
      type: object
      required: [userId, displayName, email, tenantId, tenantName, role]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        role:
          type: string
          enum: [Owner, Manager, Staff, ReadOnly]
    AutomationStatus:
      type: object
      required: [globalEnabled, tenantEnabled, effectiveEnabled, tenantRowVersion, cancelledActionCount]
      properties:
        globalEnabled:
          type: boolean
        tenantEnabled:
          type: boolean
        effectiveEnabled:
          type: boolean
        tenantRowVersion:
          type: string
          description: Opaque concurrency token for tenant automation writes.
        cancelledActionCount:
          type: integer
          minimum: 0
    SetTenantAutomationRequest:
      type: object
      required: [enabled, expectedRowVersion, reasonCode]
      properties:
        enabled:
          type: boolean
        expectedRowVersion:
          type: string
          minLength: 1
        reasonCode:
          type: string
          enum: [TenantRequest, OperationalIncident, PlannedMaintenance, IncidentResolved, MaintenanceComplete]
    LeadStatus:
      type: string
      enum: [New, Contacting, AwaitingCustomer, Qualified, BookingOffered, NeedsHuman, Booked, Closed, ClosedWon]
    LeadUrgency:
      type: string
      enum: [Unknown, Low, Normal, High, CriticalReview]
    LeadSummary:
      type: object
      required:
        - id
        - displayName
        - primaryPhoneE164
        - source
        - status
        - urgency
        - automationState
        - assignedUserId
        - assignedUserName
        - lastActivityAtUtc
        - hasUnreadCustomerActivity
        - rowVersion
        - createdAtUtc
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, 'null']
        primaryPhoneE164:
          type: string
        source:
          type: string
        status:
          $ref: '#/components/schemas/LeadStatus'
        urgency:
          $ref: '#/components/schemas/LeadUrgency'
        automationState:
          type: string
          enum: [Active, PausedByUser, PausedBySystem, Completed, SuppressedOptOut, SuppressedPolicy]
        assignedUserId:
          type: [string, 'null']
          format: uuid
        assignedUserName:
          type: [string, 'null']
        lastActivityAtUtc:
          type: string
          format: date-time
        hasUnreadCustomerActivity:
          type: boolean
        rowVersion:
          type: string
          description: Opaque concurrency token that must be returned with write operations.
        createdAtUtc:
          type: string
          format: date-time
    LeadPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeadSummary'
        nextCursor:
          type: [string, 'null']
    AssignableUser:
      type: object
      required: [userId, displayName, role]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [Owner, Manager, Staff, ReadOnly]
    LeadTimelineItem:
      type: object
      required: [id, type, label, body, direction, kind, status, failureDescription, actorName, occurredAtUtc]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [Call, Sms, Note, System]
        label:
          type: string
        body:
          type: [string, 'null']
        direction:
          type: [string, 'null']
          enum: [Inbound, Outbound, null]
        kind:
          type: [string, 'null']
          enum: [Automated, Manual, System, null]
        status:
          type: [string, 'null']
          enum: [Queued, Sent, Delivered, Failed, Received, Suppressed, null]
        failureDescription:
          type: [string, 'null']
        actorName:
          type: [string, 'null']
        occurredAtUtc:
          type: string
          format: date-time
    PendingAction:
      type: object
      required: [id, actionType, status, scheduledForUtc, attemptCount, isCancellable]
      properties:
        id:
          type: string
          format: uuid
        actionType:
          type: string
        status:
          type: string
          enum: [Pending, Running, Completed, Cancelled, Failed]
        scheduledForUtc:
          type: string
          format: date-time
        attemptCount:
          type: integer
          minimum: 0
        isCancellable:
          type: boolean
    QualificationAnswer:
      type: object
      required: [id, questionKey, questionPrompt, value, outcome, createdAtUtc]
      properties:
        id:
          type: string
          format: uuid
        questionKey:
          type: string
        questionPrompt:
          type: string
        value:
          type: [string, 'null']
        outcome:
          type: string
          enum: [Accepted, Unknown, Ambiguous]
        createdAtUtc:
          type: string
          format: date-time
    AiAnalysisValues:
      type: object
      required: [serviceCategory, urgency, summary, city, postalCode, preferredCallbackWindow, suggestedReply]
      properties:
        serviceCategory:
          type: string
          maxLength: 100
        urgency:
          $ref: '#/components/schemas/LeadUrgency'
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        city:
          type: [string, 'null']
          maxLength: 200
        postalCode:
          type: [string, 'null']
          maxLength: 200
        preferredCallbackWindow:
          type: [string, 'null']
          maxLength: 200
        suggestedReply:
          type: [string, 'null']
          maxLength: 1000
    AiAnalysisReview:
      type: object
      required: [id, schemaVersion, allowedCategories, suggestion, confidence, requiresHumanReview, reasonCodes, reviewStatus, reviewedValues, correctionReason, reviewedByUserId, reviewedByUserName, reviewedAtUtc, rowVersion, createdAtUtc]
      properties:
        id:
          type: string
          format: uuid
        schemaVersion:
          type: string
        allowedCategories:
          type: array
          minItems: 1
          items:
            type: string
        suggestion:
          $ref: '#/components/schemas/AiAnalysisValues'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        requiresHumanReview:
          type: boolean
        reasonCodes:
          type: array
          items:
            type: string
        reviewStatus:
          type: string
          enum: [Pending, Accepted, Edited, Rejected]
        reviewedValues:
          oneOf:
            - $ref: '#/components/schemas/AiAnalysisValues'
            - type: 'null'
        correctionReason:
          type: [string, 'null']
          maxLength: 500
        reviewedByUserId:
          type: [string, 'null']
          format: uuid
        reviewedByUserName:
          type: [string, 'null']
        reviewedAtUtc:
          type: [string, 'null']
          format: date-time
        rowVersion:
          type: string
          description: Opaque AI review concurrency token.
        createdAtUtc:
          type: string
          format: date-time
    LeadDetail:
      type: object
      required: [lead, timeline, pendingActions, assignableUsers, allowedTransitions, qualificationAnswers, currentQualificationQuestion, bookingUrl, aiAnalyses]
      properties:
        lead:
          $ref: '#/components/schemas/LeadSummary'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/LeadTimelineItem'
        pendingActions:
          type: array
          items:
            $ref: '#/components/schemas/PendingAction'
        assignableUsers:
          type: array
          items:
            $ref: '#/components/schemas/AssignableUser'
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/LeadStatus'
        qualificationAnswers:
          type: array
          items:
            $ref: '#/components/schemas/QualificationAnswer'
        currentQualificationQuestion:
          type: [string, 'null']
        bookingUrl:
          type: [string, 'null']
          format: uri
        aiAnalyses:
          type: array
          items:
            $ref: '#/components/schemas/AiAnalysisReview'
    AssignLeadRequest:
      type: object
      required: [assignedUserId, expectedRowVersion]
      properties:
        assignedUserId:
          type: [string, 'null']
          format: uuid
        expectedRowVersion:
          type: string
          minLength: 1
    TransitionLeadRequest:
      type: object
      required: [targetStatus, reason, closeReason, minimumRequiredDetailsPresent, expectedRowVersion]
      properties:
        targetStatus:
          $ref: '#/components/schemas/LeadStatus'
        reason:
          type: [string, 'null']
          maxLength: 500
        closeReason:
          type: [string, 'null']
          enum: [LostNoResponse, LostOutOfArea, LostUnavailableService, Duplicate, Spam, OptedOut, null]
        minimumRequiredDetailsPresent:
          type: boolean
        expectedRowVersion:
          type: string
          minLength: 1
    LeadAutomationRequest:
      type: object
      required: [expectedRowVersion]
      properties:
        expectedRowVersion:
          type: string
          minLength: 1
    LeadBookingRequest:
      type: object
      required: [expectedRowVersion]
      properties:
        expectedRowVersion:
          type: string
          minLength: 1
    AddLeadNoteRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    ManualMessageRequest:
      type: object
      required: [body, idempotencyKey]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1600
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
    AcceptAiAnalysisRequest:
      type: object
      required: [expectedRowVersion, correctionReason]
      properties:
        expectedRowVersion:
          type: string
          minLength: 1
        correctionReason:
          type: [string, 'null']
          maxLength: 500
    EditAiAnalysisRequest:
      allOf:
        - $ref: '#/components/schemas/AiAnalysisValues'
        - type: object
          required: [correctionReason, expectedRowVersion]
          properties:
            correctionReason:
              type: [string, 'null']
              maxLength: 500
            expectedRowVersion:
              type: string
              minLength: 1
    RejectAiAnalysisRequest:
      type: object
      required: [expectedRowVersion, correctionReason]
      properties:
        expectedRowVersion:
          type: string
          minLength: 1
        correctionReason:
          type: [string, 'null']
          maxLength: 500
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    LeadConflictProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [current]
          properties:
            current:
              oneOf:
                - $ref: '#/components/schemas/LeadDetail'
                - type: 'null'
