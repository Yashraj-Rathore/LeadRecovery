openapi: 3.1.0
info:
  title: LeadRecovery API
  version: 1.0.0-draft
  description: Initial contract skeleton. Keep synchronized with implementation.
servers:
  - url: https://app.example.com/api/v1
paths:
  /auth/me:
    get:
      summary: Get current authenticated user and tenant
      responses:
        '200':
          description: Current session
        '401':
          description: Not authenticated
  /leads:
    get:
      summary: List tenant-scoped leads
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: urgency
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Lead page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadPage'
  /leads/{leadId}:
    get:
      summary: Get lead details
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDetail'
        '404':
          description: Not found in active tenant
  /leads/{leadId}/transitions:
    post:
      summary: Perform an allowed lead state transition
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetStatus]
              properties:
                targetStatus:
                  type: string
                reason:
                  type: string
                expectedRowVersion:
                  type: string
                  contentEncoding: base64
                  description: Opaque encoding of the application-managed concurrency version.
      responses:
        '200':
          description: Updated lead
        '409':
          description: Invalid transition or concurrency conflict
  /leads/{leadId}/messages:
    post:
      summary: Queue a manual SMS
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, idempotencyKey]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 1000
                idempotencyKey:
                  type: string
                  maxLength: 100
      responses:
        '202':
          description: Message queued
        '409':
          description: Suppressed or duplicate
  /webhooks/twilio/call-status:
    post:
      summary: Twilio call status callback
      security: []
      responses:
        '200':
          description: Accepted or duplicate
        '403':
          description: Invalid signature
  /webhooks/twilio/sms/inbound:
    post:
      summary: Twilio inbound SMS webhook
      security: []
      responses:
        '200':
          description: Accepted or duplicate
        '403':
          description: Invalid signature
components:
  parameters:
    LeadId:
      in: path
      name: leadId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LeadSummary:
      type: object
      required: [id, status, urgency, phone, createdAtUtc]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, 'null']
        phone:
          type: string
        status:
          type: string
        urgency:
          type: string
        serviceCategory:
          type: [string, 'null']
        createdAtUtc:
          type: string
          format: date-time
    LeadPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeadSummary'
        nextCursor:
          type: [string, 'null']
    LeadDetail:
      allOf:
        - $ref: '#/components/schemas/LeadSummary'
        - type: object
          required: [automationState, rowVersion]
          properties:
            automationState:
              type: string
            rowVersion:
              type: string
              contentEncoding: base64
              description: Opaque application-managed concurrency version.
            messages:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  direction:
                    type: string
                  body:
                    type: string
                  status:
                    type: string
                  createdAtUtc:
                    type: string
                    format: date-time
