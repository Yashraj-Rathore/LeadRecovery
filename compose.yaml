name: leadrecovery

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadrecovery}
      POSTGRES_USER: ${POSTGRES_USER:-leadrecovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ stores data in a major-version-specific subdirectory.
      - leadrecovery-postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: leadrecovery-api:${IMAGE_VERSION:-0.0.0-local}
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      args:
        VERSION: ${IMAGE_VERSION:-0.0.0-local}
        REVISION: ${IMAGE_REVISION:-unknown}
        CREATED: ${IMAGE_CREATED:-unknown}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-leadrecovery};Username=${POSTGRES_USER:-leadrecovery};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    command:
      - --migrate
    depends_on:
      postgres:
        condition: service_healthy

  leadrecovery-api:
    image: leadrecovery-api:${IMAGE_VERSION:-0.0.0-local}
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      args:
        VERSION: ${IMAGE_VERSION:-0.0.0-local}
        REVISION: ${IMAGE_REVISION:-unknown}
        CREATED: ${IMAGE_CREATED:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      AI_CATEGORY_QUESTION_KEY: ${AI_CATEGORY_QUESTION_KEY:-service}
      AI_ENABLED: ${AI_ENABLED:-false}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-leadrecovery.session}
      AUTOMATION_GLOBAL_ENABLED: ${AUTOMATION_GLOBAL_ENABLED:-false}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-leadrecovery};Username=${POSTGRES_USER:-leadrecovery};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
      DATA_PROTECTION_KEY_PATH: /keys
      DemoSeed__Enabled: ${DEMOSEED__ENABLED:-false}
      DemoSeed__OwnerEmail: ${DEMOSEED__OWNEREMAIL:-}
      DemoSeed__OwnerPassword: ${DEMOSEED__OWNERPASSWORD:-}
      DemoSeed__StaffEmail: ${DEMOSEED__STAFFEMAIL:-}
      DemoSeed__StaffPassword: ${DEMOSEED__STAFFPASSWORD:-}
      DemoSeed__BetaOwnerEmail: ${DEMOSEED__BETAOWNEREMAIL:-}
      DemoSeed__BetaOwnerPassword: ${DEMOSEED__BETAOWNERPASSWORD:-}
      DemoSeed__AlphaUrgentPhone: ${DEMOSEED__ALPHAURGENTPHONE:-}
      DemoSeed__AlphaBookingPhone: ${DEMOSEED__ALPHABOOKINGPHONE:-}
      DemoSeed__BetaLeadPhone: ${DEMOSEED__BETALEADPHONE:-}
      DemoSeed__AlphaProviderPhone: ${DEMOSEED__ALPHAPROVIDERPHONE:-}
      DemoSeed__BetaProviderPhone: ${DEMOSEED__BETAPROVIDERPHONE:-}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RateLimiting__LoginPermitLimit: ${RATELIMITING__LOGINPERMITLIMIT:-5}
      RateLimiting__ManualMessagePermitLimit: ${RATELIMITING__MANUALMESSAGEPERMITLIMIT:-10}
      RateLimiting__WebhookTokenLimit: ${RATELIMITING__WEBHOOKTOKENLIMIT:-200}
      RateLimiting__WebhookTokensPerSecond: ${RATELIMITING__WEBHOOKTOKENSPERSECOND:-40}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WEBHOOK_BASE_URL: ${TWILIO_WEBHOOK_BASE_URL:-http://localhost:8080}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - leadrecovery-keys:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: leadrecovery-worker:${IMAGE_VERSION:-0.0.0-local}
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
      args:
        VERSION: ${IMAGE_VERSION:-0.0.0-local}
        REVISION: ${IMAGE_REVISION:-unknown}
        CREATED: ${IMAGE_CREATED:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ALLOW_REAL_SMS: ${ALLOW_REAL_SMS:-false}
      AI_CATEGORY_QUESTION_KEY: ${AI_CATEGORY_QUESTION_KEY:-service}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-sol}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_RETRY_BASE_DELAY_MILLISECONDS: ${AI_RETRY_BASE_DELAY_MILLISECONDS:-250}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      AUTOMATION_GLOBAL_ENABLED: ${AUTOMATION_GLOBAL_ENABLED:-false}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-leadrecovery};Username=${POSTGRES_USER:-leadrecovery};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
      JOBS_WORKER_COUNT: ${JOBS_WORKER_COUNT:-4}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RETENTION_BACKUP_CONFIRMED: ${RETENTION_BACKUP_CONFIRMED:-false}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-100}
      RETENTION_CRON: ${RETENTION_CRON:-0 2 * * *}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
      RETENTION_MODE: ${RETENTION_MODE:-dry-run}
      SMS_PROVIDER: ${SMS_PROVIDER:-fake}
      SMS_WORKER_COUNT: ${SMS_WORKER_COUNT:-2}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WEBHOOK_BASE_URL: ${TWILIO_WEBHOOK_BASE_URL:-http://localhost:8080}
    ports:
      - "${WORKER_HEALTH_PORT:-8081}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: leadrecovery-web:${IMAGE_VERSION:-0.0.0-local}
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        API_BASE_URL: http://leadrecovery-api:8080
        VERSION: ${IMAGE_VERSION:-0.0.0-local}
        REVISION: ${IMAGE_REVISION:-unknown}
        CREATED: ${IMAGE_CREATED:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      API_BASE_URL: http://leadrecovery-api:8080
      SERVER_API_BASE_URL: http://leadrecovery-api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      leadrecovery-api:
        condition: service_healthy

volumes:
  leadrecovery-keys:
  leadrecovery-postgres:
