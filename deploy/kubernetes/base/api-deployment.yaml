apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadrecovery-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: leadrecovery-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/yashraj-rathore/leadrecovery-api:sha-replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: leadrecovery-config
          env:
            - name: ConnectionStrings__Database
              valueFrom:
                secretKeyRef:
                  name: leadrecovery-secrets
                  key: database-connection-string
            - name: DATA_PROTECTION_KEY_PATH
              value: /keys
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: leadrecovery-secrets
                  key: twilio-auth-token
                  optional: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data-protection
              mountPath: /keys
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: data-protection
          persistentVolumeClaim:
            claimName: leadrecovery-data-protection
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
