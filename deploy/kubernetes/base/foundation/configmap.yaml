apiVersion: v1
kind: ConfigMap
metadata:
  name: leadrecovery-config
data:
  AI_ENABLED: "false"
  ALLOW_REAL_SMS: "false"
  API_BASE_URL: http://leadrecovery-api:8080
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  ASPNETCORE_HTTP_PORTS: "8080"
  AUTOMATION_GLOBAL_ENABLED: "false"
  DemoSeed__Enabled: "false"
  JOBS_WORKER_COUNT: "2"
  LOG_LEVEL: Information
  RETENTION_ENABLED: "false"
  RETENTION_MODE: dry-run
  SERVER_API_BASE_URL: https://leadrecovery.example.com
  SMS_PROVIDER: fake
  TZ: UTC
  TWILIO_WEBHOOK_BASE_URL: https://leadrecovery.example.com
