apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: leadrecovery-staging

resources:
  - ../../migration

images:
  - name: ghcr.io/yashraj-rathore/leadrecovery-api
    newTag: sha-replace-me

patches:
  - target:
      kind: Namespace
      name: leadrecovery
    patch: |-
      - op: replace
        path: /metadata/name
        value: leadrecovery-staging
  - target:
      kind: ConfigMap
      name: leadrecovery-config
    patch: |-
      - op: replace
        path: /data/SERVER_API_BASE_URL
        value: https://staging.leadrecovery.example.com
      - op: replace
        path: /data/TWILIO_WEBHOOK_BASE_URL
        value: https://staging.leadrecovery.example.com
