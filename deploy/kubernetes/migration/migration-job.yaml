apiVersion: batch/v1
kind: Job
metadata:
  name: leadrecovery-migrate
  labels:
    app.kubernetes.io/component: migration
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: leadrecovery-api
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/yashraj-rathore/leadrecovery-api:sha-replace-me
          args:
            - --migrate
          envFrom:
            - configMapRef:
                name: leadrecovery-config
          env:
            - name: ConnectionStrings__Database
              valueFrom:
                secretKeyRef:
                  name: leadrecovery-secrets
                  key: database-connection-string
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
