apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: leadrecovery-production

resources:
  - ../base
  - api-hpa.yaml
  - api-pdb.yaml
  - web-pdb.yaml

images:
  - name: ghcr.io/yashraj-rathore/leadrecovery-api
    newTag: sha-replace-me
  - name: ghcr.io/yashraj-rathore/leadrecovery-worker
    newTag: sha-replace-me
  - name: ghcr.io/yashraj-rathore/leadrecovery-web
    newTag: sha-replace-me

patches:
  - target:
      kind: Namespace
      name: leadrecovery
    patch: |-
      - op: replace
        path: /metadata/name
        value: leadrecovery-production
  - target:
      kind: ConfigMap
      name: leadrecovery-config
    patch: |-
      - op: replace
        path: /data/SERVER_API_BASE_URL
        value: https://app.leadrecovery.example.com
      - op: replace
        path: /data/TWILIO_WEBHOOK_BASE_URL
        value: https://app.leadrecovery.example.com
  - target:
      kind: Deployment
      name: leadrecovery-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: leadrecovery-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: PersistentVolumeClaim
      name: leadrecovery-data-protection
    patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteMany
      - op: add
        path: /spec/storageClassName
        value: shared-rwx
  - target:
      kind: Ingress
      name: leadrecovery
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.leadrecovery.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.leadrecovery.example.com
